# Render Blueprint: deploys both backend (Web Service) and frontend (Static Site).
# In Render dashboard: New -> Blueprint -> point to this repo.
services:
  - type: web
    name: ai-quiz-app-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://ai-quiz-app-frontend.onrender.com

  - type: web
    name: ai-quiz-app-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-quiz-app-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
